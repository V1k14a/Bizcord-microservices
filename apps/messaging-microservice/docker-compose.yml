services:
  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # Dev-mode Vault for local secrets; for file-backed + unseal flow see vault/config.hcl and course docs.
  vault:
    image: hashicorp/vault:1.15
    cap_add:
      - IPC_LOCK
    ports:
      - "8200:8200"
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: dev-root-token
    command: server -dev -dev-root-token-id=dev-root-token -dev-listen-address=0.0.0.0:8200

  messaging-microservice:
    build:
      context: ../..
      dockerfile: apps/messaging-microservice/Dockerfile
    depends_on:
      rabbitmq:
        condition: service_healthy
      vault:
        condition: service_started
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      RabbitMQ__ConnectionString: host=rabbitmq;username=guest;password=guest
      Jwt__SigningKey: ""
      Vault__Address: http://vault:8200
      Vault__Token: dev-root-token
